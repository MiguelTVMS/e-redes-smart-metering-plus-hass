name: Tests

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'custom_components/e_redes_smart_metering_plus/**'
      - 'tests/**'
      - 'scripts/**'
      - 'dev/home-assistant/**'
      - '.vscode/**'
      - '.dockerignore'
      - '.gitattributes'
      - 'Dockerfile.tests'
      - 'Makefile'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'requirements_dev.txt'
      - 'hacs.json'
      - '.github/workflows/tests.yml'
      - '.github/instructions/copilot-instructions.md'
  push:
    branches:
      - release/**
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements_dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Run tests
        run: |
          python -c "from pathlib import Path; Path('.reports').mkdir(exist_ok=True)"
          pytest -q --junitxml=.reports/pytest-junit.xml

      - name: Ensure test report exists
        if: always()
        run: |
          python -c "from pathlib import Path; p = Path('.reports/pytest-junit.xml'); p.parent.mkdir(exist_ok=True); p.write_text('<testsuite/>', encoding='utf-8') if not p.exists() else None"

      - name: Upload test report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: .reports/**
          if-no-files-found: ignore

  container-tests:
    name: Pytest (development container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached development test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tests
          load: true
          tags: e-redes-smart-metering-plus-dev-tests:latest
          cache-from: type=gha,scope=development-tests
          cache-to: type=gha,mode=max,scope=development-tests

      - name: Run tests in the development container
        run: docker compose --profile tools run --rm tests

  windows-tooling:
    name: Windows tooling
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          foreach ($file in Get-ChildItem scripts/*.ps1) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref] $tokens,
                  [ref] $errors
              ) | Out-Null
              $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              exit 1
          }

      - name: Validate editor configuration and shell line endings
        shell: pwsh
        run: |
          Get-Content -Raw .vscode/settings.json | ConvertFrom-Json | Out-Null
          Get-Content -Raw .vscode/tasks.json | ConvertFrom-Json | Out-Null
          $lineEndings = git ls-files --eol Makefile scripts/bootstrap-local scripts/install-hooks.sh scripts/pre-commit scripts/send-test-webhook scripts/validate
          $lineEndings
          if ($lineEndings -match "w/crlf") {
              throw "A POSIX entry point was checked out with CRLF line endings."
          }
